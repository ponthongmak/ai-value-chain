<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Value Chain Map</title>
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f1efe9; --text:#1d1d1b; --muted:#5f5c55; --faint:#8b887f; --border:#e2dfd6;
  --accent:#3b4fd8; --accent-soft:#e8ebfd;
  --t1:#6b3fd1; --t1s:#efe8fd; --t2:#0f7b6c; --t2s:#e0f3ef; --t3:#2563c9; --t3s:#e3edfc; --t4:#9a5f00; --t4s:#fbefd6; --t5:#6d6a73; --t5s:#ecebee;
  --pass:#1f7a3a; --pass-soft:#e2f3e6; --warn:#956000; --warn-soft:#fbefd6; --fail:#b0352b; --fail-soft:#fbe5e2;
  --bar:#c9c5ba; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --radius:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1c1c1a; --surface-2:#262623; --text:#ecebe6; --muted:#a8a69e; --faint:#7d7b74; --border:#363531;
    --accent:#8c9bff; --accent-soft:#252a4d;
    --t1:#b69bff; --t1s:#2d2445; --t2:#4fd1b9; --t2s:#123029; --t3:#7fb0ff; --t3s:#18284a; --t4:#f0b44c; --t4s:#352a12; --t5:#b3b0aa; --t5s:#2c2b29;
    --pass:#6fd38a; --pass-soft:#16301c; --warn:#f0b44c; --warn-soft:#352a12; --fail:#ff8a7d; --fail-soft:#3b1d1a;
    --bar:#4a4944; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1c1c1a; --surface-2:#262623; --text:#ecebe6; --muted:#a8a69e; --faint:#7d7b74; --border:#363531;
  --accent:#8c9bff; --accent-soft:#252a4d;
  --t1:#b69bff; --t1s:#2d2445; --t2:#4fd1b9; --t2s:#123029; --t3:#7fb0ff; --t3s:#18284a; --t4:#f0b44c; --t4s:#352a12; --t5:#b3b0aa; --t5s:#2c2b29;
  --pass:#6fd38a; --pass-soft:#16301c; --warn:#f0b44c; --warn-soft:#352a12; --fail:#ff8a7d; --fail-soft:#3b1d1a;
  --bar:#4a4944; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[lang="th"] body{font-family:"Leelawadee UI","Noto Sans Thai","Sarabun",Tahoma,system-ui,sans-serif;line-height:1.7}
html[lang="th"] .eyebrow, html[lang="th"] th, html[lang="th"] .dsec h4, html[lang="th"] .fact h4, html[lang="th"] .kv b, html[lang="th"] .band{letter-spacing:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{line-height:1.25;margin:0}
h2{font-size:22px;letter-spacing:-.01em}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}

header.hero{padding:36px 0 4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:34px;letter-spacing:-.02em;margin:8px 0 10px}
.hero .lede{max-width:760px;color:var(--muted);font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.notice{display:flex;gap:10px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--radius);padding:12px 14px;font-size:13.5px}
.notice svg{flex:none;color:var(--warn);margin-top:2px}

section{padding:44px 0 8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{margin-top:6px;max-width:740px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-1{background:var(--t1s);color:var(--t1)} .b-2{background:var(--t2s);color:var(--t2)} .b-3{background:var(--t3s);color:var(--t3)} .b-4{background:var(--t4s);color:var(--t4)} .b-5{background:var(--t5s);color:var(--t5)}
.b-pass{background:var(--pass-soft);color:var(--pass)} .b-later{background:var(--warn-soft);color:var(--warn)} .b-fail{background:var(--fail-soft);color:var(--fail)} .b-neutral{background:var(--surface-2);color:var(--muted)}
.tk{display:inline-flex;align-items:center;gap:5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;font-weight:650;padding:3px 9px;border-radius:7px;border:1px solid transparent;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.tk:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tk-1{background:var(--t1s);color:var(--t1);border-color:color-mix(in srgb,var(--t1) 25%,transparent)}
.tk-2{background:var(--t2s);color:var(--t2);border-color:color-mix(in srgb,var(--t2) 25%,transparent)}
.tk-3{background:var(--t3s);color:var(--t3);border-color:color-mix(in srgb,var(--t3) 25%,transparent)}
.tk-4{background:var(--t4s);color:var(--t4);border-color:color-mix(in srgb,var(--t4) 25%,transparent)}
.tk-5{background:var(--t5s);color:var(--t5);border-color:color-mix(in srgb,var(--t5) 25%,transparent)}
.tk-plain{background:var(--surface-2);color:var(--faint);cursor:default;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 50%,transparent)}
.tk-plain:hover{transform:none;box-shadow:none}
.tks{display:flex;flex-wrap:wrap;gap:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.seg button .c{color:var(--faint);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}

/* flow */
.bands{display:grid;grid-template-columns:4fr 3fr;gap:14px;margin-bottom:8px}
.band{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);padding-bottom:6px}
.band span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint);margin-left:6px}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px;position:relative}
.fnode{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:176px;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
.fnode:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.fnode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.fnode:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:12px;height:12px;border-top:2px solid var(--faint);border-right:2px solid var(--faint);transform:translateY(-50%) rotate(45deg)}
.fnode .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fnode[aria-pressed="true"] .ic{background:var(--accent);color:var(--surface)}
.fnode .ln{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em}
.fnode .nm{font-weight:650;font-size:13.5px;line-height:1.3}
.fnode .sup{margin-top:auto;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.fnode .sup b{color:var(--text);font-weight:600}
.tdots{display:flex;gap:3px;flex-wrap:wrap}
.tdots i{width:8px;height:8px;border-radius:50%}
.moneyflow{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.moneyflow svg{flex:none;color:var(--pass)}
.ldetail{margin-top:14px;padding:20px}
.ld-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.ld-head h3{font-size:20px;letter-spacing:-.01em}
.ld-lead{font-size:15.5px;margin-top:8px;max-width:840px}
.ld-analogy{margin-top:6px;font-size:13.5px;color:var(--muted)}
.ld-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-top:18px}
.subs{display:flex;flex-direction:column;gap:10px}
.sub{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--bg)}
.sub h4{font-size:14.5px}
.sub .what{font-size:13.5px;margin-top:4px}
.sub .why{font-size:13px;color:var(--muted);margin-top:4px}
.sub .why b{color:var(--text);font-weight:600}
.sub .tks{margin-top:8px}
.facts{display:flex;flex-direction:column;gap:14px}
.fact h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:5px}
.fact ul{margin:0;padding-left:18px;font-size:13.5px}
.fact li{margin:2px 0}
.fact p{font-size:13.5px}
.ld-note{margin-top:14px;font-size:13px;background:var(--warn-soft);border-radius:8px;padding:9px 12px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale div{border-radius:10px;padding:10px 12px}
.scale b{display:block;font-size:14px}
.scale span{font-size:12px;opacity:.85}
.comp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.comp div{padding:12px;font-size:13px}
.comp b{display:block;font-size:13.5px;margin-bottom:3px}
.comp span{color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--text);min-width:170px}
select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ucard{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.ucard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.ucard .top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.ucard .sym{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:16px}
.ucard .nm{font-size:13px;color:var(--muted)}
.ucard .moat{font-size:12.5px}
.mbar{display:flex;align-items:center;gap:8px}
.mbar .track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mbar .track i{display:block;height:100%;border-radius:99px}
.mbar b{font-size:13px;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.ldots{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.ldots i{width:13px;height:5px;border-radius:2px;background:var(--surface-2)}
.ldots i.on{background:var(--accent)}
.ldots span{font-size:11px;color:var(--faint);margin-left:4px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flags .badge{font-size:11px;padding:1px 7px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}


.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
tbody tr:first-child td{border-top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arr{opacity:.5;margin-left:4px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.detail td{background:var(--surface-2);font-size:13.5px;color:var(--muted);border-top:0;padding-top:4px}
.sym-cell{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:2px}

footer{padding:30px 0 50px;color:var(--faint);font-size:12.5px}

.scrim{position:fixed;inset:0;background:rgba(10,10,10,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(var(--dw),100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{padding:18px 18px 0;border-bottom:1px solid var(--border)}
.dh .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh .sym{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px;font-weight:700}
.dtabs{display:flex;gap:4px;margin-top:12px}
.dtabs button{border:0;background:none;padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.db{padding:4px 18px 28px;overflow-y:auto;flex:1}
.dsec{padding:14px 0;border-bottom:1px solid var(--border)}
.dsec:last-child{border-bottom:0}
.dsec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.syncbar{position:sticky;top:0;z-index:60;padding:9px 16px;font-size:13px;text-align:center;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--border)}
.syncbar a{color:inherit;font-weight:600}
.mix{margin-top:10px}
.mix summary{cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);list-style:none;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.mix summary::-webkit-details-marker{display:none}
.mix summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.mix[open] summary::after{transform:rotate(225deg) translate(-2px,0)}
.mix summary .pill{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.mixbody{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mixbody svg{width:132px;height:132px;flex:none}
.mixlegend{flex:1;min-width:190px;font-size:13px}
.mixlegend div{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.mixlegend i{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.mixlegend span{flex:1}
.mixlegend b{font-variant-numeric:tabular-nums;font-weight:600}
.mixsum{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.mixsum span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.dsec ul{margin:0;padding:0;list-style:none}
.dsec li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14px}
.dsec li .lnb{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;flex:none}
.caveat{font-size:13.5px;background:var(--warn-soft);border-radius:8px;padding:9px 12px;margin-top:8px}
.compbars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:10px}
.compbars .track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.compbars .track i{display:block;height:100%;border-radius:99px}
.compbars b{font-variant-numeric:tabular-nums;font-weight:600}
.bigscore{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigscore b{font-size:36px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.tvbox{margin-top:10px;min-height:60px}
.tvlinks{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.tvnote{font-size:12px;color:var(--faint);margin-top:8px}

/* AI analysis tab */
.ai-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.ai-meta .when{font-size:12.5px;color:var(--muted)}
.ai-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b-model{background:var(--accent-soft);color:var(--accent)}
.ai-disc{font-size:12px;color:var(--faint);line-height:1.55;margin-top:10px}
.ai-head{font-size:17px;line-height:1.4;margin:2px 0 0}
.ai-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ai-tile{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.ai-tile span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
html[lang="th"] .ai-tile span{letter-spacing:0}
.ai-tile b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ai-tile em{display:block;font-style:normal;font-size:12px;margin-top:1px}
.up{color:var(--pass)} .down{color:var(--fail)} .flat{color:var(--warn)}
.ai-emas{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.ai-spark svg{width:100%;height:auto;display:block;margin-top:6px}
.ai-spark .lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.ai-spark .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}
.ai-text{font-size:14px;line-height:1.7}
.ai-text + .ai-text{margin-top:8px}
.ai-list{margin:0;padding-left:18px!important;list-style:disc!important}
.ai-list li{display:list-item!important;padding:3px 0!important;font-size:14px}
.ai-co{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ai-co > div{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.ai-co .c{background:var(--fail-soft)} .ai-co .o{background:var(--pass-soft)}
.ai-co b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.ai-co .c b{color:var(--fail)} .ai-co .o b{color:var(--pass)}
.ai-src{font-size:13px}
.ai-src li{display:block!important;padding:4px 0!important}
.ai-src .pub{color:var(--faint);font-size:12px}
.ai-empty{text-align:center;padding:30px 10px}

.chat{position:fixed;right:18px;bottom:18px;z-index:60;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 36px));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:none;padding:0;flex-direction:column;overflow:hidden}

.chat-sug{display:flex;flex-direction:column;gap:6px}

/* header + tabs */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}

/* scores table */

/* drawer: scores, peers */
.spanel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.spanel div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}

.prow{display:grid;grid-template-columns:118px 1fr 28px;gap:1px 10px;align-items:center;padding:5px 0;font-size:13px}
.prow .track{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prow .track i{display:block;height:100%;border-radius:99px}

.prow .drv{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.45}

.dgo{display:flex;gap:8px;flex-wrap:wrap}

/* news */
.lnews{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.nhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.nhead h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0}
html[lang="th"] .nhead h4{letter-spacing:0}

.nthemes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nthemes span{font-size:12px;background:var(--surface-2);border-radius:999px;padding:2px 10px;color:var(--muted)}
.nlist{display:flex;flex-direction:column;margin-top:8px}
.nitem{padding:10px 0;border-top:1px solid var(--border)}
.nitem:first-child{border-top:0}

.imp-positive{background:var(--pass)} .imp-negative{background:var(--fail)} .imp-mixed{background:var(--warn)}
.ntitle{display:block;font-weight:600;font-size:14.5px;margin-top:2px;color:var(--text);text-decoration:none;line-height:1.4}

.nfeed{padding:2px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* trend charts, sparklines, pillar rows (series colors = validated default palette slots 1-2) */
:root{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926}
.tchart{width:100%;height:auto;display:block;overflow:visible}
.tchart .grid{stroke:var(--border);stroke-width:1}
.tchart .zero{stroke:var(--faint);stroke-width:1}
.tchart .ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tchart .s1{fill:var(--s1)} .tchart .s2{fill:var(--s2)}
.tchart .mline{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round}

.tlegend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 2px}
.tlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tlegend i.s1{background:var(--s1)} .tlegend i.s2{background:var(--s2)} .tlegend i.ln{height:2px;width:14px;vertical-align:3px}
.phead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap}

.pscore{margin-left:auto;font-size:12px;color:var(--muted)} .pscore b{font-size:17px;color:var(--text)}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) 96px minmax(0,1fr) 70px 42px;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.srow .sv{font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}

.srow .sv em.up{color:var(--pass)} .srow .sv em.dn{color:var(--fail)}

.srow .track i{display:block;height:100%;border-radius:99px}
.srow > b{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.spk{display:block;overflow:visible}
.spk polyline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spk.down polyline{stroke:var(--faint)}
.spk .fitl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.spk circle.last{fill:var(--s1)} .spk.down circle.last{fill:var(--faint)}
.spk circle.hit{fill:transparent;cursor:default}
.spk-empty{color:var(--faint);font-size:12px}
.dtable{margin-top:8px}
.qh{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:5px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:10.5px;font-weight:700;line-height:1;cursor:pointer;vertical-align:1px;padding:0;text-transform:none;letter-spacing:0}
.qh:hover{border-color:var(--accent);color:var(--accent)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.help{position:fixed;top:0;right:0;height:100%;width:min(var(--pw),100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(0,0,0,.14);z-index:70;transform:translateX(100%);transition:transform .2s ease,visibility 0s linear .2s;visibility:hidden;pointer-events:none;display:flex;flex-direction:column}
.help.show{transform:none;visibility:visible;pointer-events:auto;transition:transform .2s ease}
/* Resizable panels: drag the left edge (or focus it and use the arrow keys). Pop-ups dock beside the open drawer. */
:root{--dw:580px;--pw:440px}
.rsz{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:3;border:0;background:transparent;padding:0}
.rsz::after{content:"";position:absolute;left:4px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:var(--border);transition:background .15s}
.rsz:hover::after,.rsz:focus-visible::after,.rsz.drag::after{background:var(--accent)}

body.resizing .drawer,body.resizing .help{transition:none}
body.drawer-open.dock .help.show{right:min(var(--dw),100vw);width:min(var(--pw),calc(100vw - min(var(--dw),100vw) - 16px));box-shadow:-6px 0 20px rgba(0,0,0,.10)}

/* Series built from window.FUND.stocks[t].ser (4 fiscal years + TTM, all in USD). i = point, s = ser. */
const div = (a, b) => a != null && b ? a / b : null;
const SERIES = {
  rev:(i, s) => s.rev[i], gp:(i, s) => s.gp[i], ni:(i, s) => s.ni[i], oi:(i, s) => s.oi[i], fcf:(i, s) => s.fcf[i],
  gpa:(i, s) => div(s.gp[i], s.assets[i]), om:(i, s) => div(s.oi[i], s.rev[i]), fcfm:(i, s) => div(s.fcf[i], s.rev[i]),
  roa:(i, s) => div(s.ni[i], s.assets[i]), de:(i, s) => s.equity[i] > 0 ? div(s.debt[i], s.equity[i]) : null,
  netcash:(i, s) => s.cash[i] != null && s.debt[i] != null ? div(s.cash[i] - s.debt[i], s.mcap[i]) : null,
  ey:(i, s) => div(s.ni[i], s.mcap[i]), fcfy:(i, s) => div(s.fcf[i], s.mcap[i]),
  eby:(i, s) => { const e = s.mcap[i] != null ? s.mcap[i] + (s.debt[i] || 0) - (s.cash[i] || 0) : null; return e > 0 ? div(s.ebitda[i], e) : null; },
  sy:(i, s) => { const e = s.mcap[i] != null ? s.mcap[i] + (s.debt[i] || 0) - (s.cash[i] || 0) : null; return e > 0 ? div(s.rev[i], e) : null; }
};

let JD = {};   // JD[t] = [{judge, model, weight, m, o, why_en, why_th, at}]

const FSTOCKS = () => (window.FUND && window.FUND.stocks) || {};
function rankMap(vals, ts, hi){
  const xs = ts.filter(t => vals[t] != null).map(t => [t, vals[t]]).sort((a, b) => a[1] - b[1]);
  const out = {}, n = xs.length;
  for (let i = 0; i < n;){
    let j = i; while (j + 1 < n && xs[j + 1][1] === xs[i][1]) j++;
    const r = n > 1 ? ((i + j) / 2) / (n - 1) * 100 : 50;
    for (let q = i; q <= j; q++) out[xs[q][0]] = hi ? r : 100 - r;
    i = j + 1;
  }
  return out;
}
/* Least-squares line through the non-null points. */
function fit(xs, ys){
  const p = xs.map((x, i) => [x, ys[i]]).filter(([x, y]) => x != null && y != null && isFinite(y));
  if (p.length < 3) return null;
  const n = p.length, mx = p.reduce((a, q) => a + q[0], 0) / n, my = p.reduce((a, q) => a + q[1], 0) / n;
  let sxy = 0, sxx = 0; p.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; });
  return sxx ? {b:sxy / sxx, a:my - sxy / sxx * mx} : null;
}
const YEAR_MS = 3.15576e10;
const pointYears = F => F.ser.t.map(d => new Date(d === 'TTM' ? ((F.q && F.q.t && F.q.t.length) ? F.q.t[F.q.t.length - 1] : F.asOf) : d).getTime() / YEAR_MS);
const pointLabels = F => F && F.ser ? F.ser.t.map(d => d === 'TTM' ? 'TTM' : 'FY' + d.slice(0, 4)) : [];
const avgOf = a => a.reduce((x, y) => x + y, 0) / a.length;
function metric(F, m){
  if (!F || F.error) return null;
  if (m.calc === 'px'){
    if (!F.px12) return null;
    const v = m.s === 'r2' ? F.px12.r2 * Math.sign(F.px12.slope) : F.px12.slope;
    return {avg:v, last:v, ser:(F.price5y || []).slice(-13).map(p => p[1]), lab:(F.price5y || []).slice(-13).map(p => p[0])};
  }
  if (!F.ser || !F.ser.t) return null;
  const ser = F.ser.t.map((_, i) => { try { const v = SERIES[m.s](i, F.ser); return v != null && isFinite(v) ? v : null; } catch(e){ return null; } });
  const have = ser.filter(v => v != null), out = {ser, last:have.length ? have[have.length - 1] : null};
  if (have.length < 3) return out;
  const xs = pointYears(F);
  if (m.calc === 'cagr'){ if (have.some(v => v <= 0)) return out; const f = fit(xs, ser.map(v => v == null ? null : Math.log(v))); out.slope = f ? Math.exp(f.b) - 1 : null; }

  else if (m.calc === 'stab'){ const mu = avgOf(have); out.avg = Math.sqrt(have.reduce((a, v) => a + (v - mu) ** 2, 0) / have.length); }

}

function computeScores(){

    if (get(t) == null || !isFinite(get(t))) return null;

    if (!cache[key]){ const vals = {}; grp.forEach(x => { const v = get(x); if (v != null && isFinite(v)) vals[x] = v; }); cache[key] = rankMap(vals, grp, m.hi !== 0); }

/* Revenue mix: a sourced revenueMix from the AI analysis wins over the hand estimate in MIX. */
function mixOf(t){
  const A = (window.AI_ANALYSIS || {})[t], rm = A && A.revenueMix;
  if (rm && Array.isArray(rm.segments) && rm.segments.length)
    return {fy: rm.fiscalYear || '', ai: A, seg: rm.segments.slice(0, 5).map(s => [s.name, s.name_th || s.name, +s.pct || 0, s.ai === 'ai' ? 2 : s.ai === 'partly' ? 1 : 0])};
  const m = MIX[t];
  return m ? {fy: m[0], seg: m.slice(1)} : null;
}
function mixShares(seg){
  const tot = seg.reduce((s, x) => s + x[2], 0) || 1, by = [0, 0, 0];
  seg.forEach(x => by[x[3]] += x[2] / tot * 100);
  return {tot, ai: Math.round(by[2]), part: Math.round(by[1]), other: Math.round(by[0])};
}
const MIX_COL = {2:'var(--accent)', 1:'var(--warn)', 0:'var(--faint)'};
function mixHTML(t){
  const m = mixOf(t); if (!m) return '';
  if (!m.seg.length) return `<details class="mix"><summary>${ui('mixBtn')}</summary><p class="small muted" style="margin-top:8px">${ui('mixPre')}</p></details>`;
  const sh = mixShares(m.seg), seen = {0:0, 1:0, 2:0};
  // order slices AI → partly → other, largest first, and shade repeated categories lighter
  const seg = m.seg.map(x => x.slice()).sort((a, b) => b[3] - a[3] || b[2] - a[2]).map(x => { const k = seen[x[3]]++; return {x, col: k ? `color-mix(in srgb, ${MIX_COL[x[3]]} ${[100, 62, 38, 22, 12][k]}%, var(--surface))` : MIX_COL[x[3]]}; });
  let a = -Math.PI / 2; const R = 56, r = 33, C = 66;
  const pt = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
  const slices = seg.map(({x, col}) => {
    const f = x[2] / sh.tot, b = a + f * 2 * Math.PI, big = f > .5 ? 1 : 0, tip = `${esc(L({n:x[0], n_th:x[1]}, 'n'))}: ${Math.round(f * 100)}%`;
    if (f >= .9999) return `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${col}" stroke-width="${R - r}"><title>${tip}</title></circle>`;
    const d = `M${pt(R, a)} A${R},${R} 0 ${big} 1 ${pt(R, b)} L${pt(r, b)} A${r},${r} 0 ${big} 0 ${pt(r, a)} Z`;
    a = b; return `<path d="${d}" fill="${col}" stroke="var(--surface)" stroke-width="1.5"><title>${tip}</title></path>`;
  }).join('');
  const centre = `<text x="${C}" y="${C - 2}" text-anchor="middle" font-size="17" font-weight="700" fill="var(--text)">${sh.ai}%</text><text x="${C}" y="${C + 13}" text-anchor="middle" font-size="9" fill="var(--muted)">${LANG === 'th' ? 'AI' : 'AI-driven'}</text>`;
  const legend = seg.map(({x, col}) => `<div><i style="background:${col}"></i><span>${esc(L({n:x[0], n_th:x[1]}, 'n'))}</span><b>${Math.round(x[2] / sh.tot * 100)}%</b></div>`).join('');
  const sum = [['mixAI', sh.ai, 2], ['mixPart', sh.part, 1], ['mixOther', sh.other, 0]].filter(s => s[1] > 0).map(s => `<span style="--c:${MIX_COL[s[2]]}">${ui(s[0])} ${s[1]}%</span>`).join('');

    <div class="mixbody"><svg viewBox="0 0 132 132" role="img" aria-label="${ui('mixBtn')}">${slices}${centre}</svg><div class="mixlegend">${legend}</div></div>
    <div class="mixsum">${sum}</div><p class="small muted" style="margin-top:6px">${note}</p></details>`;
}

/* Drag-to-resize: the drawer (--dw) and the pop-up panels (--pw). Arrow keys nudge, double-click resets; widths are remembered. */
const PANEL_W = {dw:[360, .92], pw:[300, .7]};
function setPanelW(v, px){ const [min, max] = PANEL_W[v]; px = Math.round(Math.max(min, Math.min(px, innerWidth * max))); document.documentElement.style.setProperty('--' + v, px + 'px'); updateDock(); return px; }
/* Dock pop-ups beside the open drawer whenever at least 320px are free; otherwise they stack on top (phones). */

function makeResizable(el, v){
  if (!el || el.querySelector(':scope > .rsz')) return;
  const h = document.createElement('button'); h.type = 'button'; h.className = 'rsz'; h.title = 'Drag to resize · double-click to reset'; h.setAttribute('aria-label', 'Resize panel');
  el.appendChild(h);
  h.addEventListener('pointerdown', e => {
    e.preventDefault(); try { h.setPointerCapture(e.pointerId); } catch(err){} h.classList.add('drag'); document.body.classList.add('resizing');
    const right = el.getBoundingClientRect().right;
    const move = ev => store.set('air.' + v, setPanelW(v, right - ev.clientX));
    const up = () => { h.classList.remove('drag'); document.body.classList.remove('resizing'); ['pointermove', 'pointerup', 'pointercancel'].forEach((n, i) => h.removeEventListener(n, i ? up : move)); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  h.addEventListener('keydown', e => { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault(); store.set('air.' + v, setPanelW(v, el.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 24 : -24))); });
  h.addEventListener('dblclick', () => { document.documentElement.style.removeProperty('--' + v); store.set('air.' + v, null); });
}

function sparkSvg(ind){

  const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1), y = v => pad + (hi - v) / span * (H - 2 * pad);
  const path = arr => arr.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');

}

    const changed = Object.keys({...prev, ...JOBS}).filter(k => JSON.stringify(prev[k]) !== JSON.stringify(JOBS[k]));
    const finished = Object.keys(prev).filter(k => isActive(prev[k]) && JOBS[k] && !isActive(JOBS[k]));
    const fin = {news:finished.filter(isNewsKey), fund:finished.includes('FUND'), judge:finished.filter(k => /^J-/.test(k)), ai:finished.filter(k => !isNewsKey(k) && k !== 'FUND' && !/^J-/.test(k))};

    if (fin.ai.length){ await reloadAnalysis(); fin.ai.forEach(rerenderAIIfOpen); renderKPIs(); }
    if (fin.news.length) await reloadScript('ai-news.js');
    if (fin.fund) { await reloadScript('fundamentals.js'); rescore(); }
    if (changed.some(isNewsKey) || fin.news.length) renderNewsAll();

    if (openTicker && changed.includes(openTicker)) rerenderAIIfOpen(openTicker);

function mdLite(src){
  const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let out = '', list = null, para = [];
  const flushP = () => { if (para.length){ out += `<p>${inline(para.join('<br>'))}</p>`; para = []; } };
  const flushL = () => { if (list){ out += `</${list}>`; list = null; } };
  esc(src).split('\n').forEach(line => {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))){
      flushP(); const kind = /^\s*\d/.test(line) ? 'ol' : 'ul';
      if (list !== kind){ flushL(); out += `<${kind}>`; list = kind; }
      out += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^#{1,4}\s+(.*)$/))){ flushP(); flushL(); out += `<h5>${inline(m[1])}</h5>`; }
    else if (!line.trim()){ flushP(); flushL(); }
    else { flushL(); para.push(line); }
  });
  flushP(); flushL();
  return out;
}

async function chatSend(text){
  text = text.trim(); if (!text || chatBusy || !SERVED) return;
  const ctxKey = chatCtxT || '_page';
  // A session id only continues a chat on the provider that created it.
  const sameProv = !chat.prov || !BACKEND.chatProvider || chat.prov === BACKEND.chatProvider;
  const body = {message:text, sessionId:sameProv ? (chat.sid || undefined) : undefined};
  if (!sameProv) chat.sentCtx = null;
  if (chat.sentCtx !== ctxKey || !chat.sid){ body.context = chatContext(chatCtxT); }
  chat.msgs.push({role:'user', text});
  const reply = {role:'assistant', text:'', tools:[]}; chat.msgs.push(reply);
  chatBusy = new AbortController(); $('#chatSend').textContent = aiT('stop'); chatRender();
  let gotDone = false;
  try {
    const r = await fetch((BRIDGE || '') + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json', 'X-AI-Map':'1'}, body:JSON.stringify(body), signal:chatBusy.signal});
    if (!r.ok || !r.body) throw new Error((await r.text()) || r.status);
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', lastWasTool = false, raf = 0;
    const paint = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; chatRender(); }); };
    for (;;){
      const {value, done} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch(e){ continue; }
        if (ev.type === 'text'){ if (lastWasTool && reply.text) reply.text += '\n\n'; lastWasTool = false; reply.text += ev.text; }
        else if (ev.type === 'tool'){ reply.tools.push({name:ev.name, detail:ev.detail}); lastWasTool = true; }
        else if (ev.type === 'done'){ gotDone = true; chat.sid = ev.sessionId || chat.sid; chat.prov = ev.provider || chat.prov; chat.sentCtx = ctxKey; }
        else if (ev.type === 'error'){ throw new Error(ev.message); }
        paint();
      }
    }
    if (!gotDone && !reply.text) throw new Error('No reply');
  } catch(e){
    if (e.name !== 'AbortError'){ if (!reply.text || reply.text.trim() === String(e.message || '').trim()) chat.msgs.splice(chat.msgs.indexOf(reply), 1); chat.msgs.push({role:'error', text:String(e.message || e)}); }
  } finally {
    chatBusy = null; $('#chatSend').textContent = aiT('send'); chatSave(); chatRender();
  }
}

  renderConn();
  if (!LOCAL_SERVER && /^https?:$/.test(location.protocol)){
    // Hosted copy (e.g. GitHub Pages): use the visitor's own bridge if it is running.
    try {
      const r = await fetch(BRIDGE_URL + '/api/status', {signal:AbortSignal.timeout(2500)});
      if (r.ok){
        BRIDGE = BRIDGE_URL; SERVED = true;
        await Promise.all(['ai-analysis.js', 'ai-news.js', 'fundamentals.js', 'judgments.js'].map(reloadScript));   // the visitor's own, newer data
        renderAll();
      }
    } catch(e){ /* no bridge: read-only */ }
  }
  if (!SERVED){ renderConn(); return; }
  try {
    const r = await api('/api/status'); if (!r.ok){ renderConn(); return; }
    BACKEND = await r.json(); JOBS = BACKEND.jobs || {};
    renderChatChrome(); rerenderAIIfOpen(); renderNewsAll(); $('#fundMeta').innerHTML = fundMetaHTML(); renderSyncBar();
    if (Object.values(JOBS).some(isActive)) pollJobs();
  } catch(e){ /* plain static hosting: no backend */ }
  renderConn();
})();

renderAll();
</script>
</body>
</html>
